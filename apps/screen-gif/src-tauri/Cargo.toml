[package]
name = "screen-gif"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
screen-gif-encoder = { path = "../encoder" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = ["tray-icon"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
] }
windows-capture = "=2.0.1"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
