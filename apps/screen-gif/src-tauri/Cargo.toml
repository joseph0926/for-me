[package]
name = "screen-gif"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
screen-gif-encoder = { path = "../encoder" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = ["tray-icon", "macos-private-api"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
] }
windows-capture = "=2.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "=11.1.2"
libc = "0.2.191"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSScreen"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFArray", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGDirectDisplay", "CGError", "CGGeometry", "CGWindow"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
